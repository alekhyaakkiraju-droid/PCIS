openapi: 3.1.0
info:
  title: PCIS Claims Service API
  version: 1.0.0
  description: REST API for the PCIS claims domain service

servers:
  - url: /api/v1
    description: API Gateway proxy (dev default)

paths:
  /claims:
    get:
      operationId: listClaims
      summary: List claims with optional status filter
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [O, C, D]
          description: "O=Open, C=Closed, D=Denied"
      responses:
        "200":
          description: Claims list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Claim"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createClaim
      summary: Register a new claim (FNOL)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClaimRequest"
      responses:
        "201":
          description: Claim created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Claim"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /claims/{claimNbr}:
    parameters:
      - name: claimNbr
        in: path
        required: true
        schema:
          type: string
          maxLength: 12
    get:
      operationId: getClaim
      summary: Get a single claim with reserves and payments
      responses:
        "200":
          description: Claim detail with reserves
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /claims/{claimNbr}/reserves:
    parameters:
      - name: claimNbr
        in: path
        required: true
        schema:
          type: string
          maxLength: 12
    get:
      operationId: listReserves
      summary: List reserves for a claim
      responses:
        "200":
          description: Reserve list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClaimReserve"
    post:
      operationId: createReserve
      summary: Create a reserve on a claim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReserveRequest"
      responses:
        "201":
          description: Reserve created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimReserve"

  /claims/{claimNbr}/approvals:
    parameters:
      - name: claimNbr
        in: path
        required: true
        schema:
          type: string
          maxLength: 12
    get:
      operationId: listApprovals
      summary: List approvals for a claim
      responses:
        "200":
          description: Approval list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Approval"
    post:
      operationId: createApproval
      summary: Approve a reserve for payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApprovalRequest"
      responses:
        "201":
          description: Approval created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"

  /claims/{claimNbr}/notes:
    parameters:
      - name: claimNbr
        in: path
        required: true
        schema:
          type: string
          maxLength: 12
    post:
      operationId: createNote
      summary: Add a case note to a claim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteRequest"
      responses:
        "201":
          description: Note created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimNote"

  /claims/{claimNbr}/payments:
    parameters:
      - name: claimNbr
        in: path
        required: true
        schema:
          type: string
          maxLength: 12
    post:
      operationId: initiatePayment
      summary: Initiate a claim payment (requires CLAIMS_ADJUSTER or CLAIMS_SUPERVISOR role)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitiatePaymentRequest"
      responses:
        "201":
          description: Payment initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimPayment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

components:
  schemas:
    Claim:
      type: object
      required: [claimNbr, polNbr, custId, lossDate, claimType, claimStatus]
      properties:
        claimNbr:
          type: string
          maxLength: 12
        polNbr:
          type: string
          maxLength: 12
        custId:
          type: integer
          format: int32
        lossDate:
          type: string
          format: date
        claimType:
          type: string
          maxLength: 3
        claimStatus:
          type: string
          maxLength: 1
          enum: [O, C, D]
          description: "O=Open, C=Closed, D=Denied"

    ClaimDetail:
      allOf:
        - $ref: "#/components/schemas/Claim"
        - type: object
          properties:
            reserves:
              type: array
              items:
                $ref: "#/components/schemas/ClaimReserve"
            payments:
              type: array
              items:
                $ref: "#/components/schemas/ClaimPayment"
            notes:
              type: array
              items:
                $ref: "#/components/schemas/ClaimNote"
            authorityLimit:
              type: number
              nullable: true
            version:
              type: integer
              format: int64

    ClaimReserve:
      type: object
      required: [reserveId, claimNbr, reserveType, approvedAmt, paidToDate, reserveStatus]
      properties:
        reserveId:
          type: integer
          format: int64
        claimNbr:
          type: string
          maxLength: 12
        reserveType:
          type: string
          maxLength: 3
        approvedAmt:
          type: number
          multipleOf: 0.01
          description: NUMERIC(11,2) — no floating point
        paidToDate:
          type: number
          multipleOf: 0.01
        reserveStatus:
          type: string
          maxLength: 1
          enum: [O, C]

    ClaimPayment:
      type: object
      required: [paymentId, claimNbr, paymentAmt, paymentStatus]
      properties:
        paymentId:
          type: integer
          format: int64
        claimNbr:
          type: string
          maxLength: 12
        paymentAmt:
          type: number
          multipleOf: 0.01
        paymentStatus:
          type: string
          maxLength: 1
          enum: [P, C, F]
          description: "P=Pending, C=Completed, F=Failed"
        payeeId:
          type: integer
          format: int32
          nullable: true
        approvalId:
          type: integer
          format: int64
          nullable: true
        adjusterId:
          type: string
          maxLength: 10
          nullable: true

    Approval:
      type: object
      required: [approvalId, claimNbr, reserveId, approverId, approvalStatus]
      properties:
        approvalId:
          type: integer
          format: int64
        claimNbr:
          type: string
          maxLength: 12
        reserveId:
          type: integer
          format: int64
        approverId:
          type: string
          maxLength: 10
        approvalStatus:
          type: string
          maxLength: 1
          enum: [P, A, D]
          description: "P=Pending, A=Approved, D=Denied"
        approvalDate:
          type: string
          format: date-time
          nullable: true

    ClaimPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/Claim"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    InitiatePaymentRequest:
      type: object
      required: [reserveId, amount]
      properties:
        reserveId:
          type: integer
          format: int64
        amount:
          type: number
          multipleOf: 0.01
        payeeId:
          type: integer
          format: int32
          nullable: true

    CreateClaimRequest:
      type: object
      required: [polNbr, custId, lossDate, claimType]
      properties:
        claimNbr:
          type: string
          maxLength: 12
        polNbr:
          type: string
          maxLength: 12
        custId:
          type: integer
          format: int32
        lossDate:
          type: string
          format: date
        claimType:
          type: string
          maxLength: 3
        description:
          type: string
        initialReserveType:
          type: string
          maxLength: 3
        initialReserveAmt:
          type: number
          multipleOf: 0.01

    CreateReserveRequest:
      type: object
      required: [reserveType, approvedAmt]
      properties:
        reserveType:
          type: string
          maxLength: 3
        approvedAmt:
          type: number
          multipleOf: 0.01

    CreateApprovalRequest:
      type: object
      required: [reserveId]
      properties:
        reserveId:
          type: integer
          format: int64

    CreateNoteRequest:
      type: object
      required: [noteText]
      properties:
        noteText:
          type: string

    ClaimNote:
      type: object
      properties:
        noteId:
          type: integer
          format: int64
        claimNbr:
          type: string
        noteText:
          type: string
        createdAt:
          type: string
          format: date-time

    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri

  responses:
    BadRequest:
      description: Invalid request payload
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Unauthorized:
      description: Authentication required
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Forbidden:
      description: Insufficient permissions
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    UnprocessableEntity:
      description: Business rule violation (e.g. payment exceeds reserve, insufficient authority)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
