# PCIS SLI recording rules (WO-141).
# Source metrics: Spring Boot Actuator / Micrometer (http_server_requests_seconds,
# spring_batch_job_seconds, hikaricp_connections_active) and custom pcis_* gauges.
# Labels service, job_name, namespace, pod align with Kubernetes service discovery.
groups:
  - name: pcis-sli-recording
    interval: 30s
    rules:
      # SLI: api_request_duration_seconds — aggregated from Micrometer HTTP histogram.
      - record: pcis:api_request_duration:p50
        expr: |
          histogram_quantile(
            0.50,
            sum by (service, method, uri, status, le) (
              rate(http_server_requests_seconds_bucket[5m])
            )
          )
      - record: pcis:api_request_duration:p95
        expr: |
          histogram_quantile(
            0.95,
            sum by (service, method, uri, status, le) (
              rate(http_server_requests_seconds_bucket[5m])
            )
          )
      - record: pcis:api_request_duration:p99
        expr: |
          histogram_quantile(
            0.99,
            sum by (service, method, uri, status, le) (
              rate(http_server_requests_seconds_bucket[5m])
            )
          )

      # SLI: error_rate_5m — 5xx response rate per service over 5 minutes.
      - record: error_rate_5m
        expr: |
          (
            sum by (service) (
              rate(http_server_requests_seconds_count{status=~"5.."}[5m])
            )
            /
            clamp_min(
              sum by (service) (
                rate(http_server_requests_seconds_count[5m])
              ),
              1e-9
            )
          )
      - record: pcis:error_rate:5m
        expr: error_rate_5m

      # SLI: batch_job_duration_seconds — p95 duration per job_name (aggregated across pods).
      - record: pcis:batch_job_duration:p95
        expr: |
          histogram_quantile(
            0.95,
            sum by (job_name, le) (
              rate(spring_batch_job_seconds_bucket[5m])
            )
          )

      # SLI: batch_job_exit_code — latest exit code per job_name.
      - record: pcis:batch_job_exit_code
        expr: |
          max by (job_name, namespace, pod) (pcis_batch_job_exit_code)

      # SLI: audit_outbox_lag_seconds — relay-reported lag per service.
      - record: pcis:audit_outbox_lag_seconds
        expr: |
          max by (service, namespace, pod) (pcis_audit_outbox_lag_seconds)

      # SLI: audit_outbox_pending_count — unpublished outbox rows per service.
      - record: pcis:audit_outbox_pending_count
        expr: |
          max by (service, namespace, pod) (pcis_audit_outbox_pending_count)

      # SLI: hikaricp_connections_active — pool pressure per service.
      - record: pcis:hikaricp_connections_active
        expr: |
          max by (service, namespace, pod) (hikaricp_connections_active)

      # Batch window utilisation ratio — duration vs configured window.
      # ASSUMPTION: pcis_batch_window_seconds values are placeholders pending Phase 0
      # baseline measurement; update gauge values without changing rule structure.
      - record: pcis:batch_window:utilization_ratio
        expr: |
          (
            max by (job_name) (pcis:batch_job_duration:p95)
            /
            on(job_name) group_left()
            max by (job_name) (pcis_batch_window_seconds)
          )
