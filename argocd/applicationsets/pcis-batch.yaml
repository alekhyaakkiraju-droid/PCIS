# PCIS batch CronJob ApplicationSet (WO-139)
# Deploys helm/charts/pcis-batch to dev/tst/prd with environment-specific sync policy.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: pcis-batch
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: pcis
    pcis.work-order: WO-139
  annotations:
    pcis.governance/description: >
      Spring Batch CronJobs for six legacy COBOL programs (WO-137 chart).
      Dev sync is automated; tst/prd require manual approval (prd gated).
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - env: dev
            namespace: pcis-dev
            valuesFile: values-dev.yaml
            automated: "true"
          - env: tst
            namespace: pcis-tst
            valuesFile: values-dev.yaml
            automated: "false"
          - env: prd
            namespace: pcis-prd
            valuesFile: values-prd.yaml
            automated: "false"
  template:
    metadata:
      name: "pcis-batch-{{ .env }}"
      labels:
        app.kubernetes.io/part-of: pcis
        pcis.component: batch
        pcis.environment: "{{ .env }}"
      annotations:
        argocd.argoproj.io/sync-wave: "2"
        pcis.governance/sync-mode: "{{ if eq .automated \"true\" }}automated{{ else }}manual{{ end }}"
        pcis.governance/approval-required: "{{ if eq .env \"prd\" }}true{{ else }}false{{ end }}"
        pcis.governance/approver-group: "{{ if eq .env \"prd\" }}pcis-admins{{ else }}none{{ end }}"
        pcis.governance/change-ticket-required: "{{ if eq .env \"prd\" }}true{{ else }}false{{ end }}"
    spec:
      project: pcis
      source:
        repoURL: https://github.com/alekhyaakkiraju-droid/PCIS.git
        targetRevision: main
        path: helm/charts/pcis-batch
        helm:
          releaseName: pcis-batch
          valueFiles:
            - values.yaml
            - "{{ .valuesFile }}"
      destination:
        name: opsera-usw2-np
        namespace: "{{ .namespace }}"
      revisionHistoryLimit: 5
      syncPolicy:
        syncOptions:
          - CreateNamespace=false
          - RespectIgnoreDifferences=true
