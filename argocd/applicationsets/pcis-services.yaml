# PCIS microservice ApplicationSet (WO-139)
# Matrix: 11 services × 3 environments (dev / tst / prd).
# Dev: automated selfHeal + prune. tst/prd: manual sync (production gate on prd).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: pcis-services
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: pcis
    pcis.work-order: WO-139
  annotations:
    pcis.governance/description: >
      Generates one Argo CD Application per microservice per environment.
      Production (prd) applications carry approval-gate annotations; sync is
      manual and restricted to pcis-admins (see argocd/docs/production-approval-gate.md).
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - service: api-gateway
                - service: frontend
                - service: authz-svc
                - service: config-svc
                - service: audit-svc
                - service: customer-svc
                - service: claims-svc
                - service: policy-svc
                - service: premium-svc
                - service: billing-svc
                - service: reporting-svc
                - service: sync-agent
          - list:
              elements:
                - env: dev
                  namespace: pcis-dev
                  valuesFile: values-dev.yaml
                  sharedValuesFile: ../../values-dev-shared.yaml
                  automated: "true"
                - env: tst
                  namespace: pcis-tst
                  valuesFile: values-dev.yaml
                  sharedValuesFile: ../../values-empty.yaml
                  automated: "false"
                - env: prd
                  namespace: pcis-prd
                  valuesFile: values-prd.yaml
                  sharedValuesFile: ../../values-empty.yaml
                  automated: "false"
  template:
    metadata:
      name: "pcis-{{ .service }}-{{ .env }}"
      labels:
        app.kubernetes.io/part-of: pcis
        pcis.service: "{{ .service }}"
        pcis.environment: "{{ .env }}"
      annotations:
        argocd.argoproj.io/sync-wave: "1"
        pcis.governance/sync-mode: "{{ if eq .automated \"true\" }}automated{{ else }}manual{{ end }}"
        pcis.governance/approval-required: "{{ if eq .env \"prd\" }}true{{ else }}false{{ end }}"
        pcis.governance/approver-group: "{{ if eq .env \"prd\" }}pcis-admins{{ else }}none{{ end }}"
        pcis.governance/change-ticket-required: "{{ if eq .env \"prd\" }}true{{ else }}false{{ end }}"
        notifications.argoproj.io/subscribe.on-sync-running.slack: "{{ if eq .env \"prd\" }}pcis-prod-deployments{{ else }}disabled{{ end }}"
        notifications.argoproj.io/subscribe.on-sync-succeeded.slack: "{{ if eq .env \"prd\" }}pcis-prod-deployments{{ else }}disabled{{ end }}"
        notifications.argoproj.io/subscribe.on-sync-failed.slack: "{{ if eq .env \"prd\" }}pcis-prod-alerts{{ else }}disabled{{ end }}"
        notifications.argoproj.io/subscribe.on-health-degraded.slack: "{{ if eq .env \"prd\" }}pcis-prod-alerts{{ else }}disabled{{ end }}"
    spec:
      project: pcis
      source:
        repoURL: https://github.com/alekhyaakkiraju-droid/PCIS.git
        targetRevision: main
        path: "helm/charts/{{ .service }}"
        helm:
          releaseName: "{{ .service }}"
          valueFiles:
            - values.yaml
            - "{{ .valuesFile }}"
            - "{{ .sharedValuesFile }}"
      destination:
        name: opsera-usw2-np
        namespace: "{{ .namespace }}"
      revisionHistoryLimit: 5
      syncPolicy:
        syncOptions:
          - CreateNamespace=false
          - RespectIgnoreDifferences=true
