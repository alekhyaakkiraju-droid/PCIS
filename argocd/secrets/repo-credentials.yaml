# Placeholder repository credentials for Argo CD (WO-139)
# Synced by External Secrets Operator from AWS Secrets Manager — do not commit real credentials.
#
# Prerequisite ClusterSecretStore (WO-132):
#   metadata.name: pcis-secrets-store
# Secret payload key (placeholder):
#   pcis/argocd/repo-credentials  → username, password (GitHub PAT or deploy key)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-repo-pcis
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: pcis
    pcis.work-order: WO-139
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    external-secrets.io/placeholder: "true"
    pcis.governance/secret-source: aws-secrets-manager
    pcis.governance/secret-key: pcis/argocd/repo-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: pcis-secrets-store
    kind: ClusterSecretStore
  target:
    name: repo-pcis-github
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      type: Opaque
      data:
        type: git
        url: https://github.com/alekhyaakkiraju-droid/PCIS.git
        username: "{{ .username }}"
        password: "{{ .password }}"
  dataFrom:
    - extract:
        key: pcis/argocd/repo-credentials
