# Local Keycloak 26.x for PCIS developers (WO-145).
# Imports infra/keycloak/realm-export.json on first boot (idempotent re-import for same realm).
#
# Usage:
#   docker compose -f infra/keycloak/docker-compose.yml up -d
#   curl -s http://localhost:8080/realms/pcis/.well-known/openid-configuration | jq .
#
# Admin console: http://localhost:8080  (admin / admin — LOCAL ONLY, not for shared envs)
# Seed persona passwords are temporary placeholders in realm-export.json (TempChangeMe!*).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_local_only
    volumes:
      - pcis_keycloak_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.2
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - start-dev
      - --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_local_only
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/pcis-realm.json:ro
    ports:
      - "8080:8080"
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200\\|UP'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  pcis_keycloak_pg:
