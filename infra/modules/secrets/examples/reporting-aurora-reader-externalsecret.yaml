# Example: reporting-svc reads only the Aurora reader secret (least privilege).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aurora-reader
  namespace: pcis-dev
  labels:
    app.kubernetes.io/name: reporting-svc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: aurora-reader
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: pcis/dev/aurora-reader
        property: username
    - secretKey: password
      remoteRef:
        key: pcis/dev/aurora-reader
        property: password
    - secretKey: host
      remoteRef:
        key: pcis/dev/aurora-reader
        property: host
