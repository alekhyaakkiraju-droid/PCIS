# Example: sync Aurora writer credentials from Secrets Manager into a namespaced Secret.
# Refresh interval: 1 hour. Applications should reload credentials on refresh (no downtime).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aurora-writer
  namespace: pcis-dev # replace with pcis-{env}
  labels:
    app.kubernetes.io/part-of: pcis
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: aurora-writer
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          pcis.secret/source: secrets-manager
  dataFrom:
    - extract:
        key: pcis/dev/aurora-writer # replace env segment
