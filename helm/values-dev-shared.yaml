# Shared EKS dev overrides — merged by deploy-all-dev.sh and Argo CD (dev).
replicaCount: 1
image:
  pullPolicy: Always
imagePullSecrets:
  - name: ecr-registry-secret
autoscaling:
  enabled: false
  enableHpa: false
podDisruptionBudget:
  enabled: true
  enablePdb: true
  minAvailable: 1
istio:
  inject: false
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi
probes:
  startup:
    failureThreshold: 60
    periodSeconds: 10
  readiness:
    initialDelaySeconds: 30
    periodSeconds: 10
  liveness:
    path: /actuator/health/readiness
    initialDelaySeconds: 60
    periodSeconds: 15
env:
  SPRING_PROFILES_ACTIVE: dev
  OIDC_ISSUER_URI: http://keycloak.pcis-dev.svc.cluster.local/realms/pcis
  KAFKA_BOOTSTRAP_SERVERS: kafka.pcis-dev.svc.cluster.local:9092
  OTEL_SDK_DISABLED: "true"
  SPRING_AUTOCONFIGURE_EXCLUDE: io.opentelemetry.instrumentation.spring.autoconfigure.OpenTelemetryAutoConfiguration
  PCIS_CLASSIFICATION_DRIFT_DETECTION_ENABLED: "false"
  PCIS_CLASSIFICATION_LOADER_ENABLED: "false"
  MANAGEMENT_ENDPOINT_HEALTH_VALIDATE_GROUP_MEMBERSHIP: "false"
  SPRING_FLYWAY_IGNORE_MIGRATION_PATTERNS: "repeatable:ignored"
  SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING: "true"
