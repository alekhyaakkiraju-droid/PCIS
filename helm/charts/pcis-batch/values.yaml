# PCIS batch CronJobs — schedules are PLACEHOLDERS pending Phase 0 baseline (WO-137).
namespace: pcis-batch

global:
  image:
    pullPolicy: IfNotPresent
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

batchNode:
  tolerations:
    - key: batch
      operator: Equal
      value: "true"
      effect: NoSchedule
  nodeSelector:
    node-role: batch

cronJobDefaults:
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  backoffLimit: 0
  restartPolicy: Never

prometheusRule:
  enabled: true
  namespace: pcis-monitoring
  alertSeverity: critical

# Six jobs reconciled from ops/scheduler-map.yaml kubernetes_cronjobs section.
jobs:
  - name: audit-archive-job
    program: AUD002B
    # PLACEHOLDER schedule — pending Phase 0 batch-window baseline measurement
    schedule: "0 3 * * *"
    image:
      repository: ghcr.io/pcis/audit-batch
      tag: "1.0.0"
    command: ["java", "-jar", "/app/batch.jar", "--spring.batch.job.name=auditArchiveJob"]
    env:
      SPRING_PROFILES_ACTIVE: batch
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 2Gi
    serviceAccount:
      create: true
      name: audit-archive-job
      irsaRoleArn: ""

