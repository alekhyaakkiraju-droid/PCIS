{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "pcis-batch.fullname" . }}-batch-alerts
  namespace: {{ .Values.prometheusRule.namespace }}
  labels:
    {{- include "pcis-batch.labels" . | nindent 4 }}
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: pcis-batch-job-alerts
      rules:
        - alert: PcisBatchJobFailed
          expr: |
            kube_job_status_failed{namespace="{{ .Values.namespace }}", job_name=~".+"} > 0
          for: 0m
          labels:
            severity: {{ .Values.prometheusRule.alertSeverity }}
            team: platform
          annotations:
            summary: "PCIS batch job {{`{{`}} $labels.job_name {{`}}`}} failed with non-zero exit code"
            description: |
              Kubernetes Job {{`{{`}} $labels.job_name {{`}}`}} in namespace {{ .Values.namespace }}
              reported failure. Spring Batch exit codes 1-5 indicate operational failures per
              the WO-137 exit code contract (1=item threshold, 2=archive mismatch,
              3=cursor failure, 4=audit write failure, 5=config failure).
            runbook_url: "observability/runbooks/batch-job-failed.md"
        - alert: PcisBatchJobExitCodeNonZero
          expr: |
            kube_job_failed{namespace="{{ .Values.namespace }}", condition="true"} == 1
          for: 0m
          labels:
            severity: {{ .Values.prometheusRule.alertSeverity }}
            team: platform
          annotations:
            summary: "PCIS batch job {{`{{`}} $labels.job_name {{`}}`}} exited non-zero"
            description: "Job failure detected via kube_job_failed for Alertmanager P1 routing."
            runbook_url: "observability/runbooks/batch-job-failed.md"
{{- end }}
