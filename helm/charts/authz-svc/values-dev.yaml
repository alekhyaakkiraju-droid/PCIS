replicaCount: 1
autoscaling:
  enabled: true
  enableHpa: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
podDisruptionBudget:
  enabled: true
  enablePdb: true
  minAvailable: 1
ingress:
  enabled: false
  host: ''
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi
env:
  SPRING_PROFILES_ACTIVE: dev
  DATABASE_URL: jdbc:postgresql://postgresql.pcis-dev.svc.cluster.local:5432/pcis_authz
  DATABASE_USERNAME: pcis
  DATABASE_PASSWORD: pcis
  OIDC_ISSUER_URI: http://keycloak.pcis-dev.svc.cluster.local/realms/pcis
  OTEL_SDK_DISABLED: 'true'
  SPRING_AUTOCONFIGURE_EXCLUDE: io.opentelemetry.instrumentation.spring.autoconfigure.OpenTelemetryAutoConfiguration
  PCIS_CLASSIFICATION_DRIFT_DETECTION_ENABLED: 'false'
istio:
  inject: false
probes:
  startup:
    failureThreshold: 60
    periodSeconds: 10
  readiness:
    initialDelaySeconds: 30
    periodSeconds: 10
image:
  repository: 792373136340.dkr.ecr.us-west-2.amazonaws.com/opsera/pcis-authz-svc
  tag: dev-1e67a50-20260812191202-amd64
  pullPolicy: Always
