# EKS dev bootstrap — service DNS matches helm/charts/*/values-dev.yaml env vars.
namespace: pcis-dev

# Kafka optional for dev; enable after reporting-svc is deployed.
kafka:
  enabled: true

keycloak:
  hostname: pcis-dev.agent.opsera.dev
  hostnameUrl: https://pcis-dev.agent.opsera.dev
  proxyHeaders: xforwarded
  resources:
    requests:
      cpu: 200m
      memory: 768Mi
    limits:
      cpu: "1"
      memory: 1536Mi
