replicaCount: 1
autoscaling:
  enabled: true
  enableHpa: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
podDisruptionBudget:
  enabled: true
  enablePdb: true
  minAvailable: 1
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi
