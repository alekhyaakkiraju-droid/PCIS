replicaCount: 3
autoscaling:
  enabled: true
  enableHpa: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
podDisruptionBudget:
  enabled: true
  enablePdb: true
  minAvailable: 2
resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi
