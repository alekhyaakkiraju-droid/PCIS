appName: policy-svc
fullnameOverride: policy-svc
nameOverride: policy-svc

replicaCount: 2

image:
  repository: ghcr.io/pcis/policy-svc
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

serviceAccount:
  create: true
  automount: false
  name: ""

istio:
  inject: true

env: {}
envFromConfigMap: false

probes:
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 10
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 5
  startup:
    failureThreshold: 30
    periodSeconds: 10

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  enableHpa: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  enablePdb: true
  minAvailable: 1

networkPolicy:
  enabled: true
  allowedPeers:
  - customer-svc
  - claims-svc
  - premium-svc
configMap:
  enabled: false
  data: {}

securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
