  design_doc_table_count: 55

entity_reconciliation:
  code_witnessed_extras:
    - entity: AUDIT_LOG_ARCHIVE_T
      source: AUD002B.cbl, README.md
      rationale: Archive target for aged AUDIT_LOG_T rows; absent from PCIS_Database_Design.md inventory
    - entity: COMMISSION_LEDGER_T
      source: CMM001B.cbl
      rationale: Commission accrual ledger written by CMM001B; design lists COMMISSION_PAYMENT_T instead
  flyway_extras:
    - OUTBOX_EVENTS
  note: Final Flyway V1 baseline defines 57 base tables (not 55 design-doc tables).

audit_log_canonicalization:
  key_generation: IDENTITY
  key_generation_rationale: Flyway V1 uses BIGINT GENERATED ALWAYS AS IDENTITY for LOG_ID
