spring:
  application:
    name: pcis-outbox-test
  autoconfigure:
    exclude:
      - com.pcis.observability.config.ObservabilityAutoConfiguration
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: pcis-outbox-it
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

pcis:
  outbox:
    relay-interval-ms: 60000
    relay-batch-size: 10
    relay-max-retries: 3
    kafka-topic: pcis.domain.events
    relay-enabled: true

logging:
  level:
    com.pcis.outbox: DEBUG
