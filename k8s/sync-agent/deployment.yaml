apiVersion: apps/v1
kind: Deployment
metadata:
  name: sync-agent
  labels:
    app: sync-agent
    app.kubernetes.io/part-of: pcis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sync-agent
  template:
    metadata:
      labels:
        app: sync-agent
    spec:
      containers:
        - name: sync-agent
          image: ghcr.io/pcis/sync-agent:1.0.0
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sync-agent-db
                  key: url
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sync-agent-db
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sync-agent-db
                  key: password
            - name: SYNC_SOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: sync-agent-source
                  key: url
            - name: SYNC_SOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sync-agent-source
                  key: username
            - name: SYNC_SOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sync-agent-source
                  key: password
            - name: SYNC_POLL_INTERVAL_MS
              value: "60000"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
