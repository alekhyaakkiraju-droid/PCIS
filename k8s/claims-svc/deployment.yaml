---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-svc
  namespace: pcis
  labels:
    app: claims-svc
    domain: claims
    version: "0.1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: claims-svc
  template:
    metadata:
      labels:
        app: claims-svc
        domain: claims
    spec:
      serviceAccountName: claims-svc
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: claims-svc
          image: claims-svc:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8086
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: claims-svc-db
                  key: url
            - name: DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: claims-svc-db
                  key: username
            - name: DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: claims-svc-db
                  key: password
            - name: OIDC_ISSUER_URI
              valueFrom:
                configMapKeyRef:
                  name: pcis-oidc-config
                  key: issuer-uri
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8086
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/readiness
              port: 8086
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8086
            initialDelaySeconds: 10
            periodSeconds: 5
            # failureThreshold=30 × periodSeconds=5s = 150s max startup (allows Flyway migrations)
            failureThreshold: 30
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: claims-svc-pdb
  namespace: pcis
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: claims-svc
