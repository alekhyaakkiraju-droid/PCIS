apiVersion: batch/v1
kind: CronJob
metadata:
  name: reconciliation-job
  labels:
    app: reconciliation-batch
    job: reconciliation
    app.kubernetes.io/part-of: pcis
spec:
  schedule: "0 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: reconciliation-batch
            job: reconciliation
        spec:
          restartPolicy: Never
          containers:
            - name: reconciliation-batch
              image: ghcr.io/pcis/reconciliation-batch:1.0.0
              command:
                - java
                - -jar
                - /app/reconciliation-batch-exec.jar
                - --spring.batch.job.name=reconciliationJob
              env:
                - name: SPRING_PROFILES_ACTIVE
                  value: batch
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: reconciliation-batch-db
                      key: url
                - name: DATABASE_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: reconciliation-batch-db
                      key: username
                - name: DATABASE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: reconciliation-batch-db
                      key: password
                - name: RECON_READ_REPLICA_URL
                  valueFrom:
                    secretKeyRef:
                      name: reconciliation-batch-db
                      key: read-replica-url
                - name: RECON_READ_REPLICA_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: reconciliation-batch-db
                      key: read-replica-username
                - name: RECON_READ_REPLICA_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: reconciliation-batch-db
                      key: read-replica-password
                - name: RECON_BUSINESS_DATE
                  value: ""
                - name: RECON_MIN_CLEAN_DAYS
                  value: "30"
              resources:
                requests:
                  cpu: 500m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
