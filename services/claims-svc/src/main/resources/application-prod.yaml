spring:
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}
  flyway:
    locations: classpath:db/migration/claims

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.pcis.claims: INFO
