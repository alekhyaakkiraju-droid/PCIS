server:
  port: 8086

spring:
  application:
    name: claims-svc
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/pcis_claims}
    username: ${DATASOURCE_USERNAME:pcis_claims_app}
    password: ${DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration/claims
    baseline-on-migrate: false
    validate-migration-naming: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:https://idp.example.com/realms/pcis}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

pcis:
  observability:
    enabled: true
    trace-sample-rate: ${PCIS_TRACE_SAMPLE_RATE:0.1}
    environment: ${PCIS_ENVIRONMENT:local}
  outbox:
    relay-enabled: ${PCIS_OUTBOX_RELAY_ENABLED:true}
    relay-interval-ms: ${PCIS_OUTBOX_POLL_INTERVAL_MS:5000}
    relay-max-retries: 3
    kafka-topic: ${PCIS_CLAIMS_EVENTS_TOPIC:claims-events}
    dlq-kafka-topic: ${PCIS_CLAIMS_EVENTS_DLQ_TOPIC:claims-events-dlq}
    metrics-namespace: claims_outbox

management:
  endpoints:
    web:
      exposure:
        include: health,readiness,info,prometheus,metrics
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        liveness:
          include: livenessstate
        readiness:
          include: readinessstate,db
        startup:
          include: readinessstate,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: INFO
    com.pcis.claims: INFO

otel:
  service:
    name: claims-svc
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
  traces:
    sampler: parentbased_traceidratio
  metrics:
    exporter: none
  logs:
    exporter: none
