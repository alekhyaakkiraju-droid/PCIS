spring:
  main:
    allow-bean-definition-overriding: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost/test-issuer
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration/claims

management:
  endpoints:
    web:
      exposure:
        include: health,readiness,info,prometheus
  endpoint:
    health:
      probes:
        enabled: false
      group:
        liveness:
          include: ping
        readiness:
          include: ping,db
        startup:
          include: ping,db

pcis:
  policy-validation:
    enabled: false
  classification:
    loader-enabled: false
    drift-detection-enabled: false

logging:
  level:
    root: INFO
    com.pcis.claims: DEBUG
    org.flywaydb: INFO
