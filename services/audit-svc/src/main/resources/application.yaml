server:
  port: 8080

spring:
  application:
    name: audit-svc
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: audit-svc-outbox-relay
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    listener:
      ack-mode: record
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pcis_audit}
    username: ${DATABASE_USERNAME:pcis_audit_app}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-migration-naming: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8080/realms/pcis}

springdoc:
  api-docs:
    version: OPENAPI_3_1
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

pcis:
  outbox:
    relay-enabled: false
    kafka-topic: ${PCIS_OUTBOX_KAFKA_TOPIC:pcis.domain.events}
  audit:
    kafka:
      consumer-enabled: true
      consumer-group: audit-svc-outbox-relay

management:
  endpoints:
    web:
      exposure:
        include: health,readiness,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: INFO
    com.pcis.audit: INFO
