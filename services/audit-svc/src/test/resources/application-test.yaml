spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost/test-issuer

pcis:
  outbox:
    relay-enabled: false
  audit:
    kafka:
      consumer-enabled: false

logging:
  level:
    com.pcis.audit: DEBUG
