server:
  port: 8083

spring:
  application:
    name: premium-svc
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/pcis_premium}
    username: ${DATASOURCE_USERNAME:pcis_premium_app}
    password: ${DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:https://idp.example.com/realms/pcis}

pcis:
  premium:
    rate-table-cache-ttl-seconds: ${PREMIUM_RATE_CACHE_TTL:300}
    referral-threshold: ${PREMIUM_REFERRAL_THRESHOLD:100000.00}
    decimal-scale: ${PREMIUM_DECIMAL_SCALE:2}
    max-coverage-lines-per-request: ${PREMIUM_MAX_COVERAGE_LINES:20}
    statement-timeout-seconds: ${PREMIUM_STATEMENT_TIMEOUT:30}

management:
  endpoints:
    web:
      exposure:
        include: health,readiness,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.pcis.premium: INFO
