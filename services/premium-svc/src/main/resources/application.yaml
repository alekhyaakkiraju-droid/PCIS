server:
  port: 8083

spring:
  application:
    name: premium-svc
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/pcis_premium}
    username: ${DATASOURCE_USERNAME:pcis_premium_app}
    password: ${DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:https://idp.example.com/realms/pcis}

pcis:
  premium:
    rate-table-cache-ttl-seconds: ${PREMIUM_RATE_CACHE_TTL:300}
    referral-threshold: ${PREMIUM_REFERRAL_THRESHOLD:100000.00}
    decimal-scale: ${PREMIUM_DECIMAL_SCALE:2}
    max-coverage-lines-per-request: ${PREMIUM_MAX_COVERAGE_LINES:20}
    statement-timeout-seconds: ${PREMIUM_STATEMENT_TIMEOUT:30}
    max-combined-discount-pct: ${PREMIUM_MAX_COMBINED_DISCOUNT_PCT:0.2500}
    max-combined-surcharge-pct: ${PREMIUM_MAX_COMBINED_SURCHARGE_PCT:0.5000}
    reinsurance-cession-threshold: ${PREMIUM_REINSURANCE_CESSION_THRESHOLD:500000.00}
    delinquency:
      chunk-size: 1
      grace-days: 10
      program-name: PRM005B
      reference-date: 2024-06-15
  tunables:
    numeric-defaults:
      premium.graceDays: 10
  batch:
    oauth2:
      token-uri: ${PCIS_BATCH_OAUTH2_TOKEN_URI:}
      client-id: ${PCIS_BATCH_OAUTH2_CLIENT_ID:batch-premium}
      client-secret: ${PCIS_BATCH_OAUTH2_CLIENT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,readiness,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.pcis.premium: INFO
