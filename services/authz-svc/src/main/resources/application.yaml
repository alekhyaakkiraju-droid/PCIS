server:
  port: 8083

spring:
  application:
    name: authz-svc
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:https://idp.example.com/realms/pcis}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pcis_authz}
    username: ${DATABASE_USERNAME:pcis_authz}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-migration-naming: true

management:
  endpoints:
    web:
      exposure:
        include: health,readiness,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

pcis:
  outbox:
    relay-enabled: false

logging:
  level:
    root: INFO
    com.pcis.authz: INFO
