spring:
  application:
    name: sync-agent
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pcis_sync}
    username: ${DATABASE_USERNAME:pcis_sync_app}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-migration-naming: true

pcis:
  classification:
    registry-location: file:config/pcis-data-classification.yaml
    drift-detection-enabled: true
    loader-enabled: true
  sync:
    enabled: true
    poll-interval-ms: ${SYNC_POLL_INTERVAL_MS:60000}
    chunk-size: ${SYNC_CHUNK_SIZE:1000}
    source:
      url: ${SYNC_SOURCE_URL:jdbc:db2://localhost:50000/INSPRDDTA}
      username: ${SYNC_SOURCE_USERNAME:sync_reader}
      password: ${SYNC_SOURCE_PASSWORD:}
      driver-class-name: ${SYNC_SOURCE_DRIVER:com.ibm.db2.jcc.DB2Driver}
    domains:
      customer:
        source-table: CUSTOMER_T
        target-table: sync_customer
        watermark-column: UPD_TIMESTAMP
        primary-key: CUST_ID
        columns:
          - CUST_ID
          - CUST_NAME
          - CUST_STATUS
          - UPD_TIMESTAMP

management:
  endpoints:
    web:
      exposure:
        include: health,readiness,prometheus,sync
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: INFO
    com.pcis.sync: INFO
