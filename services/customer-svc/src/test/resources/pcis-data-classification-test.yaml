registry_version: "test-1.0.0"
woref: WO-183-TEST

tier_handling:
  Public:
    retention_days: 365
    storage_encryption: false
    access_control: anonymous
    log_emission: allowed
  Internal:
    retention_days: 2555
    storage_encryption: at-rest-optional
    access_control: authenticated
    log_emission: allowed
  Confidential:
    retention_days: 1825
    storage_encryption: at-rest-required
    access_control: role-based
    log_emission: masked
  Restricted:
    retention_days: 2555
    storage_encryption: at-rest-required
    access_control: need-to-know
    log_emission: masked-redacted

entities:
  - entity: CUSTOMER_T
    domain: CUS
    tier: Restricted
    columns:
      - column: TAX_ID
        tier: Restricted
        pii: true
        mask_strategy: LAST_FOUR
  - entity: CUSTOMER_CONTACT_T
    domain: CUS
    tier: Restricted
    columns:
      - column: CONTACT_PHONE
        tier: Restricted
        pii: true
        mask_strategy: PHONE_LAST_FOUR
      - column: CONTACT_EMAIL
        tier: Restricted
        pii: true
        mask_strategy: EMAIL_DOMAIN_ONLY
