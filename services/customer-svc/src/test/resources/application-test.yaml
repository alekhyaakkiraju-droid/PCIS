spring:
  main:
    allow-bean-definition-overriding: true
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost/test-issuer
  cloud:
    openfeign:
      circuitbreaker:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: false
      group:
        liveness:
          include: ping
        readiness:
          include: ping,db
        startup:
          include: ping,db

pcis:
  authz-svc:
    url: http://localhost:9999
  audit-svc:
    url: http://localhost:9998
  policy-svc:
    url: http://localhost:9997
  billing-svc:
    url: http://localhost:9996
  claims-svc:
    url: http://localhost:9995
  classification:
    registry-location: classpath:pcis-data-classification-test.yaml
    drift-detection-enabled: false
    loader-enabled: false

logging:
  level:
    com.pcis.customer: DEBUG
    org.flywaydb.core: INFO
