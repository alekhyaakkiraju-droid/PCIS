server:
  port: 8084

spring:
  application:
    name: policy-svc
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/pcis_policy}
    username: ${DATASOURCE_USERNAME:pcis_policy_app}
    password: ${DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-migration-naming: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:https://idp.example.com/realms/pcis}

management:
  endpoints:
    web:
      exposure:
        # Only expose health, readiness, and info — all others disabled
        include: health,readiness,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        liveness:
          include: livenessstate
        readiness:
          include: readinessstate,db
        startup:
          include: readinessstate,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: INFO
    com.pcis.policy: INFO

pcis:
  outbox:
    relay-enabled: ${PCIS_OUTBOX_RELAY_ENABLED:false}
    kafka-topic: ${PCIS_OUTBOX_KAFKA_TOPIC:pcis.domain.events}
  authz-svc:
    url: ${AUTHZ_SVC_URL:http://authz-svc:8083}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      authz-svc:
        baseConfig: default
  timelimiter:
    configs:
      default:
        timeoutDuration: 5s
    instances:
      authz-svc:
        baseConfig: default

spring.cloud.openfeign.circuitbreaker.enabled: true
