spring:
  datasource:
    # Injected by EKS Pod from Secrets Manager — never hardcode credentials
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}

management:
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: WARN
    com.pcis.policy: INFO
