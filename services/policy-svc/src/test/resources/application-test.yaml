spring:
  main:
    allow-bean-definition-overriding: true
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost/test-issuer

management:
  endpoints:
    web:
      exposure:
        include: health,readiness,info
  endpoint:
    health:
      probes:
        enabled: false
      group:
        liveness:
          include: ping
        readiness:
          include: ping,db
        startup:
          include: ping,db

logging:
  level:
    com.pcis.policy: DEBUG
    org.flywaydb.core: INFO
