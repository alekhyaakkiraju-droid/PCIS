spring:
  main:
    allow-bean-definition-overriding: true
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost/test-issuer
  cloud:
    openfeign:
      circuitbreaker:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: false
      validate-group-membership: false
      group:
        liveness:
          include: ping
        readiness:
          include: ping,db
        startup:
          include: ping,db
  health:
    livenessstate:
      enabled: false
    readinessstate:
      enabled: false

pcis:
  outbox:
    relay-enabled: false
  authz-svc:
    url: http://localhost:9999

logging:
  level:
    com.pcis.policy: DEBUG
