spring:
  main:
    allow-bean-definition-overriding: true
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  autoconfigure:
    exclude:
      - com.pcis.batch.auth.config.BatchAuthAutoConfiguration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost/test-issuer
  cloud:
    openfeign:
      circuitbreaker:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: false
      validate-group-membership: false
      group:
        liveness:
          include: ping
        readiness:
          include: ping,db
        startup:
          include: ping,db
  health:
    livenessstate:
      enabled: false
    readinessstate:
      enabled: false

pcis:
  classification:
    registry-location: classpath:pcis-data-classification-test.yaml
    drift-detection-enabled: false
    loader-enabled: false
  tunables:
    numeric-defaults:
      policy.renewalWindowDays: 60
  outbox:
    relay-enabled: false
  authz-svc:
    url: http://localhost:9999
  premium:
    renewal-window-days: 60
  batch:
    skip-threshold: 100
    policy-renewal:
      chunk-size: 1
      skip-limit: 100
      program-name: POL006B
      reference-date: 2026-08-01
      renewal-window-days: 365

logging:
  level:
    com.pcis.policy: DEBUG

resilience4j:
  circuitbreaker:
    instances:
      premium-svc:
        slidingWindowSize: 100
        minimumNumberOfCalls: 100
        failureRateThreshold: 100
        permittedNumberOfCallsInHalfOpenState: 100
