spring:
  batch:
    job:
      enabled: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - com.pcis.batch.auth.config.BatchAuthAutoConfiguration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost/test-issuer
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

management:
  endpoints:
    web:
      exposure:
        include: health,readiness,info,prometheus
  endpoint:
    health:
      probes:
        enabled: false
      group:
        liveness:
          include: ping
        readiness:
          include: ping,db
        startup:
          include: ping,db

pcis:
  classification:
    registry-location: classpath:pcis-data-classification-test.yaml
    drift-detection-enabled: false
    loader-enabled: false
  outbox:
    relay-enabled: false
  batch:
    skip-threshold: 100
  billing:
    generation:
      reference-date: 2024-06-15
      lead-days: 15
    commission:
      reference-date: 2024-06-15

logging:
  level:
    root: INFO
    com.pcis.billing: DEBUG
    org.flywaydb: INFO
