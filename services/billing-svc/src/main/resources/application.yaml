server:
  port: 8085

spring:
  application:
    name: billing-svc
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/pcis_billing}
    username: ${DATASOURCE_USERNAME:pcis_billing_app}
    password: ${DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-migration-naming: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:https://idp.example.com/realms/pcis}

pcis:
  billing:
    generation:
      chunk-size: 1
      lead-days: 15
      program-name: BIL003B
      reference-date: 2024-06-15
    commission:
      chunk-size: 1
      program-name: CMM001B
      reference-date: 2024-06-15
  tunables:
    numeric-defaults:
      billing.leadDays: 15
      premium.graceDays: 10
  batch:
    oauth2:
      token-uri: ${PCIS_BATCH_OAUTH2_TOKEN_URI:}
      client-id: ${PCIS_BATCH_OAUTH2_CLIENT_ID:batch-billing}
      client-secret: ${PCIS_BATCH_OAUTH2_CLIENT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,readiness,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.pcis.billing: INFO
