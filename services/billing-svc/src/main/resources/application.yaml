server:
  port: 8085

spring:
  application:
    name: billing-svc
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/pcis_billing}
    username: ${DATASOURCE_USERNAME:pcis_billing_app}
    password: ${DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-migration-naming: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:https://idp.example.com/realms/pcis}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

pcis:
  billing:
    lead-days: 15
    grace-days: 10
    frequencies:
      - M
      - Q
      - S
      - A
    chunk-size: 1
    error-threshold: 100
    generation:
      chunk-size: 1
      lead-days: 15
      program-name: BIL003B
      reference-date: 2024-06-15
    commission:
      chunk-size: 1
      program-name: CMM001B
      reference-date: 2024-06-15
  outbox:
    relay-enabled: ${PCIS_OUTBOX_RELAY_ENABLED:true}
    relay-interval-ms: ${PCIS_OUTBOX_POLL_INTERVAL_MS:5000}
    relay-max-retries: 3
    kafka-topic: ${PCIS_BILLING_EVENTS_TOPIC:billing-events}
    dlq-kafka-topic: ${PCIS_BILLING_EVENTS_DLQ_TOPIC:billing-events-dlq}
    metrics-namespace: billing_outbox
  tunables:
    numeric-defaults:
      billing.leadDays: 15
      premium.graceDays: 10
  batch:
    oauth2:
      token-uri: ${PCIS_BATCH_OAUTH2_TOKEN_URI:}
      client-id: ${PCIS_BATCH_OAUTH2_CLIENT_ID:batch-billing}
      client-secret: ${PCIS_BATCH_OAUTH2_CLIENT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,readiness,info,prometheus,metrics
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        liveness:
          include: livenessstate
        readiness:
          include: readinessstate,db
        startup:
          include: readinessstate,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: INFO
    com.pcis.billing: INFO
