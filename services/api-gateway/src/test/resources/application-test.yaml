server:
  port: 0

spring:
  cloud:
    gateway:
      server:
        webflux:
          default-filters: []
          routes:
            - id: customer-svc
              uri: ${test.upstream.uri:http://127.0.0.1:9090}
              predicates:
                - Path=/api/v1/customers/**
  data:
    redis:
      host: ${redis.host:localhost}
      port: ${redis.port:6379}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.pcis.gateway: DEBUG
