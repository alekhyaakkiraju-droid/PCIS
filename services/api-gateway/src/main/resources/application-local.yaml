server:
  port: 8081

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.resource.reactive.ReactiveOAuth2ResourceServerAutoConfiguration
  data:
    redis:
      host: localhost
      port: 6380
  cloud:
    gateway:
      server:
        webflux:
          default-filters: []
          routes:
            - id: billing-customer-summary
              uri: http://127.0.0.1:8085
              order: -1
              predicates:
                - Path=/api/v1/customers/*/billing/**
            - id: customer-svc
              uri: http://127.0.0.1:8082
              predicates:
                - Path=/api/v1/customers/**
            - id: claims-svc
              uri: http://127.0.0.1:8086
              predicates:
                - Path=/api/v1/claims/**
            - id: policy-svc
              uri: http://127.0.0.1:8084
              predicates:
                - Path=/api/v1/policies/**
            - id: billing-svc
              uri: http://127.0.0.1:8085
              predicates:
                - Path=/api/v1/billing/**,/api/v1/payments/**

management:
  endpoint:
    health:
      validate-group-membership: false
