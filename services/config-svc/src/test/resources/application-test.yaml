spring:
  datasource:
    url: jdbc:h2:mem:configsvc;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

pcis:
  tunable:
    required-keys: []
  outbox:
    relay-enabled: false

logging:
  level:
    root: WARN
