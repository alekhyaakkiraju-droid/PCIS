server:
  port: 8087

spring:
  profiles:
    active: server
  application:
    name: config-svc
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pcis_config}
    username: ${DATABASE_USERNAME:pcis_config_app}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-migration-naming: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:https://idp.example.com/realms/pcis}

management:
  endpoints:
    web:
      exposure:
        include: health,info,readiness,prometheus
  endpoint:
    health:
      probes:
        enabled: true

pcis:
  outbox:
    relay-enabled: false

logging:
  level:
    root: INFO
    com.pcis.configsvc: INFO
