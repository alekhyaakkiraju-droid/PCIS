spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - io.opentelemetry.instrumentation.spring.autoconfigure.OpenTelemetryAutoConfiguration
  datasource:
    url: jdbc:postgresql://localhost:5434/pcis_config
    username: pcis
    password: pcis
  jpa:
    hibernate:
      ddl-auto: none
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/pcis

pcis:
  outbox:
    relay-enabled: false
  classification:
    drift-detection-enabled: false
    loader-enabled: false

management:
  endpoint:
    health:
      validate-group-membership: false
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
