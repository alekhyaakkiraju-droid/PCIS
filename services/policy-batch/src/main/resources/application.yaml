spring:
  application:
    name: policy-batch
  main:
    web-application-type: none
  batch:
    job:
      name: policyRenewalJob
    jdbc:
      initialize-schema: always
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pcis}
    username: ${DATABASE_USERNAME:pcis}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-migration-naming: true

pcis:
  policy:
    renewal:
      chunk-size: 1
      program-name: POL006B
      renewal-window-days: 60
      premium-svc-url: ${PCIS_PREMIUM_SVC_URL:http://localhost:8085}
  batch:
    oauth2:
      token-uri: ${PCIS_BATCH_OAUTH2_TOKEN_URI:}
      client-id: ${PCIS_BATCH_OAUTH2_CLIENT_ID:batch-renewal}
      client-secret: ${PCIS_BATCH_OAUTH2_CLIENT_SECRET:}
  tunables:
    numeric-defaults:
      policy.renewalWindowDays: 60

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

logging:
  level:
    root: INFO
    com.pcis.batch.policy: INFO
