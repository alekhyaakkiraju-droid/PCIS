spring:
  batch:
    job:
      enabled: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  autoconfigure:
    exclude:
      - com.pcis.batch.auth.config.BatchAuthAutoConfiguration

pcis:
  classification:
    registry-location: classpath:pcis-data-classification-test.yaml
    drift-detection-enabled: false
    loader-enabled: false
  batch:
    claims:
      chunk-size: 1
      skip-limit: 100
      batch-service-principal: BATCH_SVC
      cession-threshold: 100000.00
    skip-threshold: 100
