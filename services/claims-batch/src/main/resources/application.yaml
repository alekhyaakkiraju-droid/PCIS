spring:
  application:
    name: claims-batch
  main:
    web-application-type: none
  batch:
    job:
      name: claimPaymentJob
    jdbc:
      initialize-schema: always
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pcis_claims}
    username: ${DATABASE_USERNAME:pcis_claims_app}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

pcis:
  batch:
    claims:
      chunk-size: 1
      skip-limit: 100
      program-name: CLM006B
      batch-service-principal: BATCH_SVC
      cession-threshold: 100000.00
    skip-threshold: 100
    oauth2:
      token-uri: ${PCIS_BATCH_OAUTH2_TOKEN_URI:}
      client-id: ${PCIS_BATCH_OAUTH2_CLIENT_ID:batch-claims}
      client-secret: ${PCIS_BATCH_OAUTH2_CLIENT_SECRET:}
  reinsurance:
    cession-threshold: 100000.00

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

logging:
  level:
    root: INFO
    com.pcis.batch.claims: INFO
