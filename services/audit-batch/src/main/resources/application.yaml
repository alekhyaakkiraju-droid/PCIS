spring:
  application:
    name: audit-batch
  main:
    web-application-type: none
  batch:
    job:
      name: auditArchiveJob
    jdbc:
      initialize-schema: always
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pcis}
    username: ${DATABASE_USERNAME:pcis}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-migration-naming: true

pcis:
  audit:
    retention-days: 365
    chunk-size: 1000
    program-name: AUD002B
  tunables:
    numeric-defaults:
      audit.retention.days: 365
      audit.archive.chunkSize: 1000
      billing.leadDays: 15
      premium.graceDays: 30
      policy.renewalWindowDays: 60
      claims.reinsurance.cessionThreshold: 100000.00
  batch:
    oauth2:
      token-uri: ${PCIS_BATCH_OAUTH2_TOKEN_URI:}
      client-id: ${PCIS_BATCH_OAUTH2_CLIENT_ID:batch-audit}
      client-secret: ${PCIS_BATCH_OAUTH2_CLIENT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

logging:
  level:
    root: INFO
    com.pcis.batch.audit: INFO
