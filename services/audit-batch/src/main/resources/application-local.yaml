spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - io.opentelemetry.instrumentation.spring.autoconfigure.OpenTelemetryAutoConfiguration
  datasource:
    url: jdbc:postgresql://localhost:5434/pcis_audit
    username: pcis
    password: pcis

pcis:
  classification:
    drift-detection-enabled: false
    loader-enabled: false
  batch:
    oauth2:
      token-uri: http://localhost:8180/realms/pcis/protocol/openid-connect/token
      client-id: batch-audit
      client-secret-ref: local-dev
      client-secret: CHANGE_ME_BATCH_AUDIT_CLIENT_SECRET
