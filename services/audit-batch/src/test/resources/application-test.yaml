spring:
  batch:
    job:
      enabled: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  autoconfigure:
    exclude:
      - com.pcis.batch.auth.config.BatchAuthAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

pcis:
  classification:
    registry-location: classpath:pcis-data-classification-test.yaml
    drift-detection-enabled: false
    loader-enabled: false
  audit:
    retention-days: 365
    chunk-size: 1000
    retention:
      public-days: 365
      internal-days: 365
      confidential-days: 730
      restricted-days: 2555
  tunables:
    numeric-defaults:
      audit.retention.days: 365
      audit.archive.chunkSize: 1000
      billing.leadDays: 15
      premium.graceDays: 30
      policy.renewalWindowDays: 60
      claims.reinsurance.cessionThreshold: 100000.00
