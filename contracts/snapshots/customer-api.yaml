openapi: 3.1.0
info:
  title: PCIS Customer Service API
  version: 1.0.0
  description: REST API for the PCIS customer domain service

servers:
  - url: /api/v1
    description: API Gateway proxy (dev default)

paths:
  /customers:
    get:
      operationId: listCustomers
      summary: List customers with optional filtering
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Full-text search term
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated customer list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createCustomer
      summary: Create a new customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerRequest"
      responses:
        "201":
          description: Customer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /customers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
    get:
      operationId: getCustomer
      summary: Get a single customer by ID
      responses:
        "200":
          description: Customer found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  schemas:
    Customer:
      type: object
      required: [custId, custName, custType, custStatus]
      properties:
        custId:
          type: integer
          format: int32
          description: Surrogate primary key
        taxId:
          type: string
          maxLength: 11
          description: SSN or FEIN (masked in API responses for most roles)
        custName:
          type: string
          maxLength: 60
        custType:
          type: string
          maxLength: 1
          enum: [I, B]
          description: "I=Individual, B=Business"
        custStatus:
          type: string
          maxLength: 1
          enum: [A, I, S]
          description: "A=Active, I=Inactive, S=Suspended"
        addresses:
          type: array
          items:
            $ref: "#/components/schemas/CustomerAddress"
        contacts:
          type: array
          items:
            $ref: "#/components/schemas/CustomerContact"

    CustomerAddress:
      type: object
      required: [addressLine1, city, stateCode, zipCode]
      properties:
        addrId:
          type: integer
          format: int32
        addressLine1:
          type: string
          maxLength: 40
        addressLine2:
          type: string
          maxLength: 40
          nullable: true
        city:
          type: string
          maxLength: 30
        stateCode:
          type: string
          maxLength: 2
        zipCode:
          type: string
          maxLength: 10
        addrType:
          type: string
          maxLength: 3
          description: "PRM=Primary, BIL=Billing, MLG=Mailing"

    CustomerContact:
      type: object
      required: [firstName, lastName]
      properties:
        contactId:
          type: integer
          format: int32
        firstName:
          type: string
          maxLength: 30
        lastName:
          type: string
          maxLength: 30
        phoneNbr:
          type: string
          maxLength: 20
          description: Masked in API responses for most roles
        emailAddr:
          type: string
          format: email
          description: Masked in API responses for most roles
        contactType:
          type: string
          maxLength: 3

    CustomerPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/Customer"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    CreateCustomerRequest:
      type: object
      required: [custName, custType]
      properties:
        taxId:
          type: string
          maxLength: 11
        custName:
          type: string
          maxLength: 60
        custType:
          type: string
          maxLength: 1
          enum: [I, B]

    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri

  responses:
    BadRequest:
      description: Invalid request payload
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Unauthorized:
      description: Authentication required
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Forbidden:
      description: Insufficient permissions
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Conflict:
      description: Duplicate resource (e.g. tax ID conflict)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
