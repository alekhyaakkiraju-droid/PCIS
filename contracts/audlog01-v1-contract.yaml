unified_v1_schema:
  version: v1
  description: Superset of legacy AUDLOG01 shapes plus modern observability fields. Widths are the maximum of batch and interactive G-04 PIC clauses.
  fields:
    - name: action
      type: VARCHAR(3)
      nullable: false
      notes: Holds batch X(3) codes; interactive X(1) left-justified
    - name: old_value
      type: VARCHAR(100)
      nullable: true
      notes: "max(X(100) interactive, X(30) batch)"
    - name: new_value
      type: VARCHAR(100)
      nullable: true
      notes: "max(X(100) interactive, X(30) batch)"
    - name: key
      type: VARCHAR(40)
      nullable: true
      notes: "max(X(40) interactive, X(30) batch key/object)"
    - name: correlation_id
      type: UUID
      nullable: false
      notes: Generated when absent; honour inbound trace header
    - name: service
      type: VARCHAR(30)
      nullable: false
      notes: "Owning modern service (billing-svc, claims-svc, …)"
    - name: program
      type: VARCHAR(10)
      nullable: true
      notes: Legacy program id (WS-AUD-PROGRAM)
    - name: actor
      type: VARCHAR(10)
      nullable: false
      notes: Authenticated principal; replaces BATCH* literals
    - name: resource
      type: VARCHAR(50)
      nullable: false
      notes: Table/resource name (WS-AUD-TABLE / object)
    - name: operation
      type: VARCHAR(30)
      nullable: false
      notes: Canonical operation from mapping_table
    - name: timestamp
      type: TIMESTAMPTZ
      nullable: false
      notes: Event time at emit
